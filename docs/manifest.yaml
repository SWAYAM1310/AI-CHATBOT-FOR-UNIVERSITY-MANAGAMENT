# RAG corpus manifest (plan.md §8). Paths are relative to the repo root.
#
# doc_type picks the chunker at ingest:
#   policy      clause-aware split + whole-document late chunking
#   curriculum  split by course code -> parent/child chunks, relational extract
#   tabular     row extraction to a table; embedded only as fallback
#   notice      single chunk
#
# audience_roles pre-filters retrieval: a document is never surfaced to a role
# not listed here, whatever the query.

documents:
  # --- policies (synthetic; source Markdown in docs/policies/, PDFs rendered by
  #     scripts/render_policies.py) ---------------------------------------------
  - path: docs/policies/pdf/attendance_regulations.pdf
    title: Academic Regulations Part IV — Attendance (AR/IV/2026)
    doc_type: policy
    category: attendance
    audience_roles: [student, faculty, admin]
    effective_date: 2026-06-16

  - path: docs/policies/pdf/examination_regulations.pdf
    title: Academic Regulations Part V — Examination and Evaluation (AR/V/2026)
    doc_type: policy
    category: examination
    audience_roles: [student, faculty, admin]
