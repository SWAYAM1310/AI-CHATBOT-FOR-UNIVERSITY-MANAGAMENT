# Runs the backend suite against a real pgvector Postgres with NO LLM key.
# Every LLM call in the tests goes through a scripted provider, so a green run
# here is the proof that routing, RBAC and the token budget are tested offline.
name: backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: uniassist
          POSTGRES_PASSWORD: uniassist
          POSTGRES_DB: uniassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniassist -d uniassist"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://uniassist:uniassist@localhost:5432/uniassist
      # deliberately unset: the suite must never need a live provider
      LLM_API_KEY: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest
