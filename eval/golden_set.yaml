# UniAssist evaluation set (plan.md §10).
#
# One entry per question. Fields:
#   id               short stable id (role prefix + number)
#   role             student | faculty | admin  -> the default demo account for that role
#   user             optional: a specific account email (password is irrelevant, eval runs in-process)
#   question         what the user types
#   expected_tools   routing hit if ANY of these tools ran successfully (empty = no tool expected)
#   expect_all       true -> every expected tool must have run (default: any)
#   expect_refusal   true -> the assistant must not act on it: no tool succeeds except those in
#                    allowed_tools, and the text contains none of must_not_contain
#   allowed_tools    tools that may legitimately run on a refusal case (they only return the
#                    caller's OWN data - identity args are stripped server-side)
#   must_not_contain substrings that would prove a leak (case-insensitive)
#   expect_citation  true -> the answer must carry at least one resolved citation
#   expect_path      optional: fast | full | smalltalk | confirm
#   tags             free labels for --filter
#
# Default accounts (all passwords "uniassist"):
#   student  25bcp017@sot.pdpu.ac.in  Isha Kanani, CP, ~68% attendance in 24CS201T (DBMS)
#   faculty  milan.vyas@sot.pdpu.ac.in  Dr. Milan Vyas, HOD CP; teaches 24CS201P, 24CS204P, 24CP101T/P this term
#   admin    tanvi.joshi@sot.pdpu.ac.in
# Other accounts used:
#   jay.jadeja@sot.pdpu.ac.in  faculty 2, teaches 24CS201T (DBMS theory) - the ~68% cohort
#   25bcp012@sot.pdpu.ac.in    student 12, unpaid fees + pending scholarship

