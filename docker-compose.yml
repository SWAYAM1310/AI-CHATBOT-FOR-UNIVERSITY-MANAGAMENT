services:
  db:
    image: pgvector/pgvector:pg16
    container_name: uniassist-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uniassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniassist}
      POSTGRES_DB: ${POSTGRES_DB:-uniassist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - uniassist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniassist} -d ${POSTGRES_DB:-uniassist}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uniassist_pgdata:
